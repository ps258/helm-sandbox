apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-plugin
  labels:
    app: grpc-plugin
spec:
  replicas: 1
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: grpc-plugin
  template:
    metadata:
      labels:
        app: grpc-plugin
      annotations:
    spec:
      containers:
      - image: mangomm/tyk-grpc-plugin:latest
        imagePullPolicy: IfNotPresent
        name: grpc-plugin
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            drop:
              - ALL
        command: 
          - "/grpc_plugin"
        workingDir: /root
        ports:
        - containerPort: 9999
        livenessProbe:
          tcpSocket:
            port: 9999
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        readinessProbe:
          tcpSocket:
            port: 9999
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      securityContext:
        runAsUser: 1000
        fsGroup: 2000
